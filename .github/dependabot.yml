# Dependabot for GitHub Actions.
# Keeps the action versions in the workflows current, so an action whose major bump targets a newer Node runtime
# (e.g. the Node 20 -> Node 24 migration) surfaces as a reviewable PR instead of a silent CI deprecation warning.
# Review requests come from `.github/CODEOWNERS`; a `reviewers` key here is ignored — see AGENTS.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Version updates are suspended while active work on the project is paused (2026-11-09): `0` is the documented way
    # to disable them for an ecosystem without deleting its entry. Restore `10` to resume — `docs/ideas.md` carries the
    # whole resume action.
    open-pull-requests-limit: 0