name: audit

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install openspec CLI
        run: npm install --global @fission-ai/openspec@1.13.1

      - name: Run the audits
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          prompt: |
            Run the repository's three audits in sequence — the agents-auditor, the specs-auditor, and the
            architecture-auditor — and write their combined findings to a new file under `docs/audits/`, named for
            today's date (e.g. `docs/audits/2026-09-19.md`).

            Each audit has a definition under `.opencode/agent/` and an on-demand command; follow the same scope and
            the shared report contract they use (a verdict line first, then each item budgeted to its anchor and one
            line of evidence, passing checks collapsed).

            Run `./gradlew spotlessApply` so the committed file passes the build's markdown gate — CI runs `build` on
            the pull request, and an unformatted report fails it. Then commit the file on the current branch: the
            action opens the pull request from the branch's commits, so a report that is only printed produces no pull
            request. The report is the deliverable: do not apply any finding, and do not edit any file the audits
            discuss; the owner reviews the report and decides what to apply through the normal change workflow.

            The action uses your final response as the pull request body and derives the pull request **title** by
            asking a model to summarise that response in under 40 characters — the title is a summary of the whole
            response, not a line copied from it. Put `cc @${{ github.repository_owner }}` on a line in the body: that is
            what notifies the owner. Do not lead with the mention, since a response dominated by it tends to summarise
            into a title about the mention rather than the report; keep the body's substance about the report, and the
            generated title tends to name it (e.g. "2026-09-21 audit report").

            If all three audits report nothing, print that and commit nothing.
