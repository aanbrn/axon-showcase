name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Install openspec CLI
        run: npm install --global @fission-ai/openspec@1.13.2

      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            latest "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run quality gates
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew check -PskipITs -Pcoverage.gate.enabled=false
          else
            ./gradlew check
          fi
          openspec validate --all
          probe=openspec-config-probe
          trap 'rm -rf "openspec/changes/$probe"' EXIT
          output=$(openspec new change "$probe" 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "must be an array of strings|could not parse"; then
            echo "::error::config.yaml is not fully readable — an unquoted ': ' parses a declared list item as a"
            echo "::error::mapping, and a malformed scalar makes the whole file unparseable; the CLI only warns, so"
            echo "::error::this gate must fail."
            exit 1
          fi

      - name: Probe the OpenCode config's V1 read path
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD HEAD -- '.opencode/opencode.json*' .github/workflows/ci.yml)
          if [ -z "$changed" ]; then
            echo "skipped: .opencode/opencode.json* and .github/workflows/ci.yml are unchanged"
            exit 0
          fi
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          set +e
          output=$(opencode debug config 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "$output"
            echo "::error::opencode debug config failed under the V1 consumer; see the echoed output"
            exit 1
          fi
