name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Install openspec CLI
        run: npm install --global @fission-ai/openspec@1.14.0

      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          # Retried: the installer fetches its own release asset with curl piped straight into tar, honouring no retry
          # flag or environment variable, so a transient upstream failure (an HTTP 504 clears within minutes) would
          # otherwise fail this gate with an unrelated error — a red main and a manual re-run.
          for attempt in 1 2 3; do
            if bash <(curl -fsSL \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
              latest "$RUNNER_TEMP/actionlint"; then
              install_ok=1
              break
            fi
            echo "::warning::actionlint install attempt $attempt failed; retrying"
            sleep 5
          done
          if [ "${install_ok:-}" != 1 ]; then
            echo "::error::actionlint could not be installed after 3 attempts"
            exit 1
          fi
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run quality gates
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew check -PskipITs -Pcoverage.gate.enabled=false
          else
            ./gradlew check
          fi
          openspec validate --all
          probe=openspec-config-probe
          trap 'rm -rf "openspec/changes/$probe"' EXIT
          output=$(openspec new change "$probe" 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "must be an array of strings|could not parse"; then
            echo "::error::config.yaml is not fully readable — an unquoted ': ' parses a declared list item as a"
            echo "::error::mapping, and a malformed scalar makes the whole file unparseable; the CLI only warns, so"
            echo "::error::this gate must fail."
            exit 1
          fi

      - name: Probe the OpenCode config's V1 read path
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD HEAD -- '.opencode/' .github/workflows/ci.yml)
          if [ -z "$changed" ]; then
            echo "skipped: .opencode/ and .github/workflows/ci.yml are unchanged"
            exit 0
          fi
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          set +e
          output=$(opencode debug config 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "$output"
            echo "::error::opencode debug config failed under the V1 consumer; see the echoed output"
            exit 1
          fi
          # The load's exit status alone does not see a definition the loader silently degrades: a malformed frontmatter
          # (an unquoted ': ' in a multi-line scalar) leaves an agent or command resolved without its description and a
          # skill absent from the inventory, all with exit 0. Assert the resolved inventory the consumer builds.
          python3 - <<'PY'
          import json, subprocess, sys, tempfile, os, glob

          # Root the skill scan at the workspace, so a glob that matches nothing cannot pass vacuously.
          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          os.chdir(workspace)

          def capture(*args):
              fd, path = tempfile.mkstemp()
              os.close(fd)
              with open(path, "w") as out:
                  rc = subprocess.run(["opencode", *args], stdout=out, stderr=subprocess.DEVNULL).returncode
              data = open(path).read()
              os.unlink(path)
              return rc, data

          rc, out = capture("debug", "config")
          if rc != 0:
              print(f"opencode debug config exited {rc}")
              sys.exit(1)
          cfg = json.loads(out)

          rc, out = capture("debug", "skill")
          if rc != 0:
              print(f"opencode debug skill exited {rc}")
              sys.exit(1)
          skills = json.loads(out)

          failures = []
          # File-driven: every on-disk definition must appear in the resolved inventory with its description intact —
          # an entry-driven loop over the resolved map would miss a definition the loader dropped entirely.
          for kind, pattern in (("agent", ".opencode/agent/*.md"), ("command", ".opencode/commands/*.md")):
              resolved = cfg.get(kind) or {}
              for path in sorted(glob.glob(pattern)):
                  name = os.path.splitext(os.path.basename(path))[0]
                  entry = resolved.get(name)
                  if entry is None:
                      failures.append(f"{kind} '{name}' is absent from the resolved inventory")
                  elif not entry.get("description"):
                      failures.append(f"{kind} '{name}' resolved without its description")

          listed = {os.path.realpath(s["location"]) for s in skills if s.get("location")}
          for path in sorted(glob.glob(".opencode/skills/*/SKILL.md")):
              if os.path.realpath(path) not in listed:
                  failures.append(f"skill '{os.path.dirname(path)}' is absent from the resolved skill inventory")

          print("agents=%d commands=%d skills=%d" % (
              len(glob.glob(".opencode/agent/*.md")),
              len(glob.glob(".opencode/commands/*.md")),
              len(glob.glob(".opencode/skills/*/SKILL.md"))))
          if failures:
              for f in failures:
                  print(f"::error::OpenCode definition {f}")
              sys.exit(1)
          PY
