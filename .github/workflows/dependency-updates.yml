name: dependency-updates

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run dependency update report
        run: ./gradlew dependencyUpdates

      - name: Open or update the dependency updates issue
        shell: bash
        run: |
          set -euo pipefail

          report=build/dependencyUpdates/report.txt
          issue_title="Dependency updates"
          owner="${{ github.repository_owner }}"

          updates="$(awk '
            /^The following dependencies have newer versions:/ { in_updates = 1; print; next }
            /^The following dependencies have later milestone versions:/ { in_updates = 0 }
            /^Gradle CURRENT updates:/ { in_updates = 0 }
            in_updates { print }
          ' "$report" 2>/dev/null)"
          gradle="$(awk '
            /^Gradle CURRENT updates:/ { in_gradle = 1; print; next }
            in_gradle { print }
          ' "$report" 2>/dev/null)"

          if [ -n "$updates" ] || [ -n "$gradle" ]; then
            body="cc @$owner"$'\n\n'"\`\`\`text"$'\n'"$updates"$'\n'"$gradle"$'\n'"\`\`\`"
          else
            body="cc @$owner"$'\n\n'"No stable catalog updates available."
          fi

          existing="$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$issue_title\" is:issue is:open" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "${{ github.repository }}" --title "$issue_title" --body "$body"
            echo "Created new issue"
          fi
        env:
          GH_TOKEN: ${{ github.token }}