name: Dependency Updates

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Run dependency update report
        run: ./gradlew dependencyUpdates

      - name: Run web UI dependency update report
        run: ./gradlew :showcase-web-ui:npmOutdated

      - name: Open or update the dependency updates issue
        shell: bash
        run: |
          set -euo pipefail

          report=build/dependencyUpdates/report.txt
          issue_title="Dependency updates"
          owner="${{ github.repository_owner }}"

          updates="$(awk '
            /^The following dependencies have later release versions:/ { in_updates = 1; print; next }
            /^Failed to / { in_updates = 0 }
            /^Gradle CURRENT updates:/ { in_updates = 0 }
            in_updates { print }
          ' "$report" 2>/dev/null)"
          gradle="$(awk '
            /^Gradle CURRENT updates:/ { in_gradle = 1; print; next }
            in_gradle { print }
          ' "$report" 2>/dev/null)"
          gradle_version_line="$(awk '
            /^Gradle CURRENT updates:/ { in_gradle = 1; next }
            in_gradle && /Gradle:/ { print; exit }
          ' "$report" 2>/dev/null)"

          npm_report_file=showcase-web-ui/build/npm-outdated.txt
          npm_exit_file=showcase-web-ui/build/npm-outdated.exit
          npm_err_file=showcase-web-ui/build/npm-outdated.err.txt
          npm_updates="$(cat "$npm_report_file" 2>/dev/null || true)"
          npm_exit="$(cat "$npm_exit_file" 2>/dev/null || true)"

          if [ -z "$npm_updates" ] && [ -n "$npm_exit" ] && [ "$npm_exit" != "0" ]; then
            echo "The web UI dependency update report failed:" >&2
            cat "$npm_err_file" || true
            exit 1
          fi

          has_updates=false
          if [ -n "$updates" ]; then
            has_updates=true
          fi
          if [ -n "$gradle_version_line" ] && ! printf '%s' "$gradle_version_line" | grep -q "UP-TO-DATE"; then
            has_updates=true
          fi
          if [ -n "$npm_updates" ]; then
            has_updates=true
          fi

          if [ "$has_updates" = true ]; then
            body="cc @$owner"$'\n\n'"\`\`\`text"$'\n'"$updates"$'\n'"$gradle"$'\n'"\`\`\`"
            if [ -n "$npm_updates" ]; then
              body="$body"$'\n\n'"**Web UI (npm)**"$'\n\n'"\`\`\`text"$'\n'"$npm_updates"$'\n'"\`\`\`"
            fi
          else
            body="No stable catalog updates available."
          fi

          existing="$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$issue_title\" is:issue is:open" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body "$body"
            echo "Updated issue #$existing"
            issue_number="$existing"
          else
            gh issue create --repo "${{ github.repository }}" --title "$issue_title" --body "$body"
            echo "Created new issue"
            issue_number="$(gh issue list --repo "${{ github.repository }}" \
              --search "in:title \"$issue_title\" is:issue is:open" \
              --json number --jq '.[0].number // empty')"
          fi

          if [ "$has_updates" = true ] && [ -n "$issue_number" ]; then
            previous="$(gh api "repos/${{ github.repository }}/issues/$issue_number/comments" \
              --jq '[.[] | select(.user.login == "github-actions[bot]"
                and (.body | contains("cc @")))][0].id // empty')"
            if [ -n "$previous" ]; then
              gh api "repos/${{ github.repository }}/issues/comments/$previous" --method DELETE --silent
            fi
            gh issue comment "$issue_number" --repo "${{ github.repository }}" --body "$body"
            echo "Commented on issue #$issue_number"
          fi
        env:
          GH_TOKEN: ${{ github.token }}