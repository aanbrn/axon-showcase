name: dependency-updates

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run dependency update report
        run: ./gradlew dependencyUpdates

      - name: Open or update the dependency updates issue
        shell: bash
        run: |
          set -euo pipefail

          report=build/dependencyUpdates/report.txt
          issue_title="Dependency updates"
          body=""

          if [ -f "$report" ]; then
            body="\`\`\`text"$'\n'"$(cat "$report")"$'\n'"\`\`\`"
          else
            body="The dependency update report produced no output file."
          fi

          existing="$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$issue_title\" is:issue is:open" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "${{ github.repository }}" --title "$issue_title" --body "$body"
            echo "Created new issue"
          fi
        env:
          GH_TOKEN: ${{ github.token }}