name: Deployment Smoke

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep in sync with the ci release target's kubeContext in build.gradle.kts.
      CLUSTER_NAME: axon-showcase-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Set up pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.1.1
        with:
          pack-version: 0.40.9

      - name: Create the cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Build the images
        run: ./gradlew bootBuildImage :showcase-web-ui:dockerBuildImage

      - name: Load the images into the cluster
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^aanbrn/axon-showcase' \
            | sort -u \
            | while read -r image; do
                kind load docker-image --name "$CLUSTER_NAME" "$image"
              done

      - name: Install the releases
        run: ./gradlew helmInstallToCi

      - name: Smoke the deployed pipeline
        run: |
          kubectl --namespace axon-showcase port-forward service/axon-showcase-api-gateway 18080:8080 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/showcases; then
              break
            fi
            sleep 2
          done
          ./gradlew :load-tests:gatlingRun -Pprofile=smoke -PbaseUrl=http://127.0.0.1:18080
          ./gradlew :load-tests:gatlingRun -Pprofile=baseline -Pduration=PT2M -Prate=20 \
            -PsseConnections=2 -PbaseUrl=http://127.0.0.1:18080

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name ${{ env.CLUSTER_NAME }}
