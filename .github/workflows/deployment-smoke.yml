name: Deployment Smoke

on:
  schedule:
    - cron: '45 20 * * *'
  workflow_dispatch:
    inputs:
      # The runner image to validate on. Left unset, the job runs on `ubuntu-latest`; dispatch with a newer image
      # (e.g. `ubuntu-26.04`) to check the workflows before the `ubuntu-latest` label moves to it.
      runner:
        description: Runner image (defaults to ubuntu-latest)
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  smoke:
    # The `||` fallback is required at runtime: on the schedule the input is empty, so a bare `inputs.runner` would
    # resolve to an empty string and fail the job.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # Keep in sync with the ci release target's kubeContext in build.gradle.kts.
      CLUSTER_NAME: axon-showcase-smoke
    steps:
      - name: Report the runner image
        env:
          REQUESTED_IMAGE: ${{ inputs.runner || 'ubuntu-latest' }}
        run: |
          echo "runner.os: ${{ runner.os }}"
          echo "requested image: ${REQUESTED_IMAGE}"
          grep -E '^(NAME|VERSION)=' /etc/os-release || true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Set up pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.1.1
        with:
          pack-version: 0.40.9

      # The `pack`-built web UI image fails on the runner's Docker 29 setup (`ubuntu-26.04` ships 29.4.2): its `imgutil`
      # local store cannot read the layers `docker image save` produces on the new containerd/overlayfs store. The
      # daemon store alone is not the trigger — the same build succeeds on Docker 29.5.2 + overlayfs locally (the Docker
      # Images note in AGENTS.md records this) — so switching the daemon back to the overlay2 driver is the documented
      # workaround (buildpacks/pack#2527, where the error is emitted; spring-projects/spring-boot#49251 is the
      # downstream thread). The wait is bounded because the next Docker consumer is the kind cluster below. Remove this
      # step when pack/imgutil fix the store, per that issue.
      - name: Switch Docker to the overlay2 storage driver
        run: |
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker info --format 'storage-driver={{.Driver}}'

      - name: Create the cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: config/kind/kind-config.yaml

      - name: Build the images
        run: ./gradlew bootBuildImage :showcase-web-ui:dockerBuildImage

      - name: Load the images into the cluster
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^aanbrn/axon-showcase' \
            | sort -u \
            | while read -r image; do
                kind load docker-image --name "$CLUSTER_NAME" "$image"
              done

      - name: Install the releases
        run: ./gradlew helmInstallToCi

      - name: Resolve the ingress hostname
        run: echo '127.0.0.1 axon-showcase-api' | sudo tee -a /etc/hosts

      - name: Smoke the deployed pipeline
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://axon-showcase-api/showcases; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "${ready:-}" != true ]; then
            echo "The gateway is not reachable through the ingress hostname axon-showcase-api" >&2
            exit 1
          fi
          ./gradlew :load-tests:gatlingRun -Pprofile=smoke -PbaseUrl=http://axon-showcase-api

      - name: Diagnose a failed smoke
        if: failure()
        run: |
          kubectl --namespace axon-showcase get pods -o wide
          kubectl --namespace axon-showcase get events --sort-by=.lastTimestamp | tail -30
          kubectl --namespace ingress-nginx get pods -o wide
          kubectl --namespace ingress-nginx get events --sort-by=.lastTimestamp | tail -20
          kubectl --namespace ingress-nginx logs deployment/ingress-nginx-controller --tail=50 || true
          for pod in $(kubectl --namespace axon-showcase get pods -o name); do
            echo "--- $pod restarts: ---"
            kubectl --namespace axon-showcase get "$pod" \
              -o jsonpath='{.status.containerStatuses[*].restartCount}'
            kubectl --namespace axon-showcase get "$pod" \
              -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'
            echo
            kubectl --namespace axon-showcase logs "$pod" --all-containers --tail=30 || true
            kubectl --namespace axon-showcase logs "$pod" --all-containers --previous --tail=30 || true
          done

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name ${{ env.CLUSTER_NAME }}
