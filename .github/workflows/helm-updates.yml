name: helm-updates

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  helm-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run Helm update check
        run: ./gradlew helmUpdates

      - name: Open or update the Helm updates issue
        shell: bash
        run: |
          set -euo pipefail

          report=build/helm-updates/report.txt
          issue_title="Helm updates"
          owner="${{ github.repository_owner }}"

          updates="$(grep -v '^No Helm updates available' "$report" 2>/dev/null || true)"

          if [ -n "$updates" ]; then
            body="cc @$owner"$'\n\n'"\`\`\`text"$'\n'"$updates"$'\n'"\`\`\`"
          else
            body="No Helm updates available."
          fi

          existing="$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$issue_title\" is:issue is:open" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body "$body"
            echo "Updated issue #$existing"
            issue_number="$existing"
          else
            created="$(gh issue create --repo "${{ github.repository }}" --title "$issue_title" --body "$body")"
            echo "Created new issue"
            issue_number="$(gh issue list --repo "${{ github.repository }}" \
              --search "in:title \"$issue_title\" is:issue is:open" \
              --json number --jq '.[0].number // empty')"
          fi

          if [ -n "$updates" ] && [ -n "$issue_number" ]; then
            previous="$(gh api "repos/${{ github.repository }}/issues/$issue_number/comments" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("cc @")))][0].id // empty')"
            if [ -n "$previous" ]; then
              gh api "repos/${{ github.repository }}/issues/comments/$previous" --method DELETE --silent
            fi
            gh issue comment "$issue_number" --repo "${{ github.repository }}" --body "$body"
            echo "Commented on issue #$issue_number"
          fi
        env:
          GH_TOKEN: ${{ github.token }}