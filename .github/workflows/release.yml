name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, without the leading v (e.g. 0.1.0). Omit when backfilling.'
        required: false
        type: string
      publish_tag:
        description: 'Backfill: publish images for an existing release tag (e.g. v0.1.0)'
        required: false
        type: string
      dry_run:
        description: 'Build and push the images under a throwaway tag without creating a tag or release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the dispatch mode and version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -n "$PUBLISH_TAG" ] && [ -n "$REQUESTED_VERSION" ]; then
            echo "Supply either 'version' (cut a release) or 'publish_tag' (backfill), not both." >&2
            exit 1
          fi
          if [ -n "$PUBLISH_TAG" ] && [ "$DRY_RUN" = "true" ]; then
            echo "The dry-run input applies to a release dispatch, not a backfill." >&2
            exit 1
          fi
          if [ -z "$PUBLISH_TAG" ] && [ -z "$REQUESTED_VERSION" ]; then
            echo "Supply 'version' to cut a release or 'publish_tag' to backfill an existing release." >&2
            exit 1
          fi
          if [ -n "$PUBLISH_TAG" ]; then
            if ! printf '%s' "$PUBLISH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "publish_tag '$PUBLISH_TAG' is not of the form vX.Y.Z." >&2
              exit 1
            fi
            echo "MODE=backfill" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=${PUBLISH_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "MODE=release" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=${REQUESTED_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Require the tag to exist
        if: ${{ inputs.publish_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${PUBLISH_TAG}" >/dev/null 2>&1; then
            echo "Tag ${PUBLISH_TAG} does not exist." >&2
            exit 1
          fi

      - name: Require the default branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ] \
            && [ "${{ inputs.dry_run }}" != "true" ] \
            && [ -z "${{ inputs.publish_tag }}" ]; then
            echo "Release must be dispatched from main, not '${{ github.ref }}'." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag }}
          fetch-depth: 0

      - name: Validate the requested version
        if: ${{ inputs.publish_tag == '' }}
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^version=//p' gradle.properties)"
          if ! printf '%s' "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'; then
            echo "gradle.properties must declare a development version of the form X.Y.Z-SNAPSHOT, got '$declared'." >&2
            exit 1
          fi

          expected="${declared%-SNAPSHOT}"

          if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Requested version '$REQUESTED_VERSION' is not of the form X.Y.Z." >&2
            exit 1
          fi

          if [ "$REQUESTED_VERSION" != "$expected" ]; then
            echo "Requested version '$REQUESTED_VERSION' does not match the declared version '$expected'." >&2
            exit 1
          fi

      - name: Require the tag not to exist
        if: ${{ inputs.publish_tag == '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --tags --exit-code origin "refs/tags/v${RELEASE_VERSION}"; then
            echo "Tag v${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('showcase-web-ui/package-lock.json') }}

      - name: Set up pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.1.1
        with:
          pack-version: 0.40.9

      # The pack-built web UI image needs the overlay2 storage driver on the runner's Docker (see the Docker Images note
      # in AGENTS.md). Retire this step when buildpacks/pack#2527 fixes the store.
      - name: Switch Docker to the overlay2 storage driver
        run: |
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker info --format 'storage-driver={{.Driver}}'

      - name: Build the images
        shell: bash
        run: ./gradlew bootBuildImage :showcase-web-ui:dockerBuildImage -Pversion="${RELEASE_VERSION}"

      - name: Log in to the GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push the images
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="${RELEASE_VERSION}"
          if [ "${MODE}" = "release" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            tag="${RELEASE_VERSION}-dryrun-${GITHUB_RUN_ID}"
          fi
          for image in \
            aanbrn/axon-showcase-command-service \
            aanbrn/axon-showcase-api-gateway \
            aanbrn/axon-showcase-query-service \
            aanbrn/axon-showcase-projection-service \
            aanbrn/axon-showcase-web-ui; do
            target="ghcr.io/${owner}/${image##*/}"
            docker tag "${image}:${RELEASE_VERSION}" "${target}:${tag}"
            docker push "${target}:${tag}"
            if [ "${MODE}" = "release" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              docker tag "${image}:${RELEASE_VERSION}" "${target}:latest"
              docker push "${target}:latest"
            fi
          done

      - name: Package and push the Helm chart
        if: ${{ inputs.publish_tag == '' }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          chart_version="${RELEASE_VERSION}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            chart_version="0.0.0-dryrun.${GITHUB_RUN_ID}"
          fi
          ./gradlew :helm:chart:helmPackageMainChart -Pversion="${chart_version}"
          helm_bin="$(find .gradle/helm/client -name helm -type f -perm -u+x | head -1)"
          "${helm_bin}" push \
            "helm/chart/build/helm/charts/axon-showcase-${chart_version}.tgz" \
            "oci://ghcr.io/${owner}/charts"

      - name: Create the tag and the release
        if: ${{ inputs.publish_tag == '' && inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --generate-notes
