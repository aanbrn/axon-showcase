# Maximum size, in bytes, a single tracked file may reach before `verifyLargeFiles` (part of `check`) fails.
#
# The limit bounds a large blob -- a binary, a vendored archive, or an accidentally committed build output -- before it
# enters history. It is set well above the largest legitimate tracked file so ordinary source growth never trips it: the
# largest today is AGENTS.md at ~263 KiB, then showcase-web-ui/package-lock.json at ~177 KiB and the bundled Grafana
# dashboard JSON at ~119 KiB. Raise it here (one value, one place) when a legitimate file genuinely needs more room.
maxBytes = 524288
