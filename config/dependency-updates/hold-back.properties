# Coordinates held back at a version line: updates on a newer minor line within the same major are suppressed
# from the dependencyUpdates report, while patches within the held line and any major jump stay reported.
# Format (one entry per line): group:module=major.minor — the last version line the project can take.
# A leading `#` starts a comment; blank lines are ignored.
# The rationale for each held coordinate lives in showcase/quality/dependency-management.
# org.opensearch.client:opensearch-java held at 3.9: 3.10.0 changes Hit.matchedQueries()'s return type
# (List -> MatchedQueries), binary-incompatible with spring-data-opensearch 2.x's DocumentAdapters.from;
# supporting it rides spring-data-opensearch 3.x (the deferred Spring Boot 4 migration, ADR-0004).
org.opensearch.client:opensearch-java=3.9
