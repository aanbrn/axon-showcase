# Minimum statement coverage for the web UI, enforced by the npmTestCoverage gate in the frontend check.
#
# Measured with Vitest's V8 provider by `npm run test:coverage`; the Gradle npmTestCoverage task reads this value and
# injects it as VITEST_COVERAGE_MIN, which vite.config.ts feeds to Vitest's statement threshold.
#
# The floor sits well below the measured level so it holds the line rather than pinning the exact figure: at the time
# this gate landed the suite measured 91.6% statements (22 files, 103 tests). Raise it as coverage rises; lower it only
# with a reason.
coverage.statements.minimum = 0.80
