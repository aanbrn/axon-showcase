{{- /*
VerticalPodAutoscaler for the query service.
Recommends CPU/memory limits for the main container.
*/ -}}
{{- if and .Values.queryService.autoscaling.vpa.enabled }}
{{- $labels := include "common.tplvalues.merge" (dict "values" (list .Values.queryService.labels .Values.commonLabels) "context" $) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "axon-showcase.query-service.fullname" $ }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $labels "context" $) | nindent 4 }}
    app.kubernetes.io/component: query-service
  {{- if or .Values.queryService.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.queryService.annotations .Values.commonAnnotations) "context" $) }}
  annotations: {{- include "common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  # VPA policy applied to the main container (controlled/min/max resources).
  resourcePolicy:
    containerPolicies:
      - containerName: main
      {{- with .Values.queryService.autoscaling.vpa.controlledResources }}
        controlledResources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queryService.autoscaling.vpa.maxAllowed }}
        maxAllowed:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queryService.autoscaling.vpa.minAllowed }}
        minAllowed:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # Targets the query service Deployment.
  targetRef:
    apiVersion: {{ include "common.capabilities.deployment.apiVersion" $ }}
    kind: Deployment
    name: {{ include "axon-showcase.query-service.fullname" $ }}
  {{- if .Values.queryService.autoscaling.vpa.updatePolicy.updateMode }}
  updatePolicy:
    updateMode: {{ .Values.queryService.autoscaling.vpa.updatePolicy.updateMode }}
  {{- end }}
{{- end }}
