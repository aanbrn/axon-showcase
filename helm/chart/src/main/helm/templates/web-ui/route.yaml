{{- /*
Gateway API HTTPRoute for the Web UI.
Exposes the UI externally through a Gateway API implementation.
*/ -}}
{{- if .Values.webUi.route.enabled }}
{{- $labels := include "common.tplvalues.merge" (dict "values" (list .Values.webUi.route.labels .Values.commonLabels) "context" $) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "axon-showcase.web-ui.fullname" $ }}
  namespace: {{ include "common.names.namespace" $ }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $labels "context" $) | nindent 4 }}
    app.kubernetes.io/component: web-ui
  {{- if or .Values.webUi.route.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.webUi.route.annotations .Values.commonAnnotations) "context" $) }}
  annotations: {{- include "common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  # Optional hostnames and parent Gateway references.
  {{- if .Values.webUi.route.hostnames }}
  hostnames: {{- include "common.tplvalues.render" (dict "value" .Values.webUi.route.hostnames "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.webUi.route.parentRefs }}
  parentRefs: {{- include "common.tplvalues.render" (dict "value" .Values.webUi.route.parentRefs "context" $) | nindent 4 }}
  {{- end }}
  rules:
    # Route matching the configured paths to the gateway service.
    - matches: {{- include "common.tplvalues.render" (dict "value" .Values.webUi.route.matches "context" $) | nindent 6 }}
      {{- if .Values.webUi.route.filters }}
      filters: {{- include "common.tplvalues.render" (dict "value" .Values.webUi.route.filters "context" $) | nindent 6 }}
      {{- end }}
      backendRefs:
        - name: {{ include "axon-showcase.web-ui.fullname" $ }}
          port: {{ $.Values.webUi.containerPorts.server }}
    {{- if .Values.webUi.route.extraRules }}
    {{- include "common.tplvalues.render" (dict "value" .Values.webUi.route.extraRules "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
