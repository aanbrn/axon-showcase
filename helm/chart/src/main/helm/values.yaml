# @section Projection service parameters
# Projection service: consumes Kafka events and writes projections to OpenSearch.
projectionService:

  # @param projectionService.labels Additional labels for the service resources
  # @param projectionService.annotations Additional annotations for the service resources
  # @param projectionService.podLabels Additional labels for the pods
  # @param projectionService.podAnnotations Additional annotations for the pods
  labels: { }

  annotations: { }

  podLabels: { }

  podAnnotations: { }

  # @param projectionService.image.registry Projection service image registry
  # @param projectionService.image.repository Projection service image repository
  # @param projectionService.image.tag Projection service image tag
  # @param projectionService.image.digest Projection service image digest (overrides tag if set)
  # @param projectionService.image.pullPolicy Projection service image pull policy (Always, IfNotPresent, Never)
  # @param projectionService.image.pullSecrets Projection service image pull secrets
  image:
    registry: ""
    repository: aanbrn/axon-showcase-projection-service
    tag: ${projectVersion}
    digest: ""
    pullPolicy: null
    pullSecrets: [ ]

  # @param projectionService.replicaCount Number of projection service replicas
  # @param projectionService.revisionHistoryLimit Number of old ReplicaSets to keep
  # @param projectionService.updateStrategy.type Deployment update strategy type (RollingUpdate, Recreate)
  replicaCount: 1

  revisionHistoryLimit: 10

  updateStrategy:
    type: RollingUpdate

  # OpenSearch HTTP client settings.
  # @param projectionService.osViews.connectionTimeout Connection timeout
  # @param projectionService.osViews.socketTimeout Socket timeout
  # @param projectionService.osViews.socketKeepAlive Keep the socket alive
  # @param projectionService.osViews.maxConnections Maximum total connections
  # @param projectionService.osViews.maxConnectionsPerRoute Maximum connections per route
  # @param projectionService.osViews.evictIdleConnections Interval for evicting idle connections
  osViews:
    connectionTimeout: PT10S
    socketTimeout: PT30S
    socketKeepAlive: true
    maxConnections: 100
    maxConnectionsPerRoute: 100
    evictIdleConnections: PT5S

  # Event projector settings.
  # @param projectionService.projector.minConcurrency Minimum projector concurrency
  # @param projectionService.projector.maxConcurrency Maximum projector concurrency
  # @param projectionService.projector.batch.maxSize Maximum events per batch
  # @param projectionService.projector.batch.maxTime Maximum time per batch
  # @param projectionService.projector.batch.bufferMaxSize Maximum buffered events
  # @param projectionService.projector.retry.maxAttempts Projector retry attempts
  # @param projectionService.projector.retry.minBackoff Minimum retry backoff
  # @param projectionService.projector.restart.delay Delay before projector restart
  projector:
    minConcurrency: 1
    maxConcurrency: 256
    batch:
      maxSize: 100
      maxTime: PT0.1S
      bufferMaxSize: 10000
    retry:
      maxAttempts: 3
      minBackoff: PT0.1S
    restart:
      delay: PT10S

  # @param projectionService.extraEnvVars Extra environment variables (string map)
  # @param projectionService.extraEnvVarsCM Name of a ConfigMap providing extra env vars
  # @param projectionService.extraEnvVarsSecret Name of a Secret providing extra env vars
  extraEnvVars:
    JAVA_OPTS: "-XX:MaxDirectMemorySize=128M -XX:MaxGCPauseMillis=20"

  extraEnvVarsCM: ""

  extraEnvVarsSecret: ""

  # @param projectionService.containerPorts.server Application HTTP port
  # @param projectionService.containerPorts.managementServer Actuator HTTP port
  # @param projectionService.extraContainerPorts Additional container ports
  containerPorts:
    server: 8080
    managementServer: 8888

  extraContainerPorts: [ ]

  # @param projectionService.startupProbe Startup probe configuration
  # @param projectionService.livenessProbe Liveness probe configuration
  # @param projectionService.readinessProbe Readiness probe configuration
  startupProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # @param projectionService.resources.requests CPU/memory requests
  # @param projectionService.resources.limits CPU/memory limits
  resources:
    requests:
      cpu: 1.0
      memory: 0.5Gi
    limits:
      cpu: 3.0
      memory: 0.75Gi

  # @param projectionService.lifecycleHooks Container lifecycle hooks
  # @param projectionService.affinity Pod affinity
  # @param projectionService.podAffinityPreset Pod affinity preset
  # @param projectionService.podAntiAffinityPreset Pod anti-affinity preset
  # @param projectionService.nodeAffinityPreset Node affinity preset
  lifecycleHooks: { }

  affinity: { }

  podAffinityPreset: ""

  podAntiAffinityPreset: soft

  nodeAffinityPreset:
    type: ""
    key: ""
    values: [ ]

  # @param projectionService.automountServiceAccountToken Mount the service account token into the pods
  # @param projectionService.hostAliases Pod host aliases
  # @param projectionService.nodeSelector Node labels for pod assignment
  # @param projectionService.tolerations Pod tolerations
  # @param projectionService.priorityClassName Pod priority class name
  # @param projectionService.schedulerName Custom pod scheduler name
