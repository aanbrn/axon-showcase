# Default values for axon-showcase.
# This is a YAML-formatted file. Declare variables to be passed into your templates.

# @section Global parameters
# Global Docker image parameters.
# @param global.imageRegistry Global Docker image registry
# @param global.imagePullSecrets Global Docker registry secret names as an array
global:
  imageRegistry: ""
  imagePullSecrets: [ ]

# @section Common parameters
# @param kubeVersion Override Kubernetes version
# @param nameOverride String to partially override common.names.fullname template (will maintain the release name)
# @param fullnameOverride String to fully override common.names.fullname template
# @param namespaceOverride Override the deployment namespace
# @param clusterDomain Kubernetes cluster domain name
# @param extraDeploy Array of extra objects to deploy with the release
# @param commonLabels Labels to add to all deployed objects
# @param commonAnnotations Annotations to add to all deployed objects
kubeVersion: ""

nameOverride: ""

fullnameOverride: ""

namespaceOverride: ""

clusterDomain: cluster.local

extraDeploy: [ ]

commonLabels: { }

commonAnnotations: { }

# @section Infrastructure connection parameters
# Shared connection settings for the external infrastructure the services talk to.

# @param dbEvents.hosts PostgreSQL event store host(s) (comma-separated list)
# @param dbEvents.name PostgreSQL database name
# @param dbEvents.schema PostgreSQL schema
# @param dbEvents.params Additional JDBC connection parameters
# @param dbEvents.username PostgreSQL username
# @param dbEvents.passwordSecret.name Name of the Secret holding the DB password
# @param dbEvents.passwordSecret.key Key in the Secret holding the DB password
dbEvents:
  hosts: axon-showcase-db-events
  name: showcase-events
  schema: public
  params: ""
  username: showcase
  passwordSecret:
    name: axon-showcase-db-events
    key: password

# @param osViews.uris OpenSearch REST endpoint(s) (comma-separated list)
# @param osViews.secured Whether OpenSearch requires authentication
# @param osViews.passwordSecret.name Name of the Secret holding the OpenSearch password
# @param osViews.passwordSecret.key Key in the Secret holding the OpenSearch password
osViews:
  uris: http://axon-showcase-os-views:9200
  secured: false
  passwordSecret:
    name: axon-showcase-os-views
    key: elasticsearch-password

# @param kafka.bootstrapServers Kafka bootstrap servers
# @param kafka.topics.events Kafka topic carrying domain events
# @param kafka.securityProtocol Kafka security protocol (PLAINTEXT, SSL)
kafka:
  bootstrapServers: axon-showcase-kafka:9092
  topics:
    events: axon-showcase-events
  securityProtocol: PLAINTEXT

# @section Command service parameters
# Write-side service: receives commands, stores events in PostgreSQL and publishes them to Kafka.
commandService:

  # @param commandService.labels Additional labels for the service resources
  # @param commandService.annotations Additional annotations for the service resources
  # @param commandService.podLabels Additional labels for the pods
  # @param commandService.podAnnotations Additional annotations for the pods
  labels: { }

  annotations: { }

  podLabels: { }

  podAnnotations: { }

  # @param commandService.image.registry Command service image registry
  # @param commandService.image.repository Command service image repository
  # @param commandService.image.tag Command service image tag
  # @param commandService.image.digest Command service image digest (overrides tag if set)
  # @param commandService.image.pullPolicy Command service image pull policy (Always, IfNotPresent, Never)
  # @param commandService.image.pullSecrets Command service image pull secrets
  image:
    registry: ""
    repository: aanbrn/axon-showcase-command-service
    tag: ${projectVersion}
    digest: ""
    pullPolicy: null
    pullSecrets: [ ]

  # @param commandService.replicaCount Number of command service replicas
  # @param commandService.revisionHistoryLimit Number of old ReplicaSets to keep
  # @param commandService.updateStrategy.type Deployment update strategy type (RollingUpdate, Recreate)
  replicaCount: 1

  revisionHistoryLimit: 10

  updateStrategy:
    type: RollingUpdate

  # PostgreSQL connection pool settings (HikariCP).
  # @param commandService.dbEvents.pool.maxSize Maximum pool size
  # @param commandService.dbEvents.pool.minIdle Minimum number of idle connections
  # @param commandService.dbEvents.pool.maxLifetime Maximum connection lifetime (ms)
  # @param commandService.dbEvents.pool.connectionTimeout Connection timeout (ms)
  # @param commandService.dbEvents.pool.validationTimeout Validation timeout (ms)
  # @param commandService.dbEvents.pool.idleTimeout Idle connection timeout (ms)
  # @param commandService.dbEvents.pool.leakDetectionThreshold Leak detection threshold (ms)
  dbEvents:
    pool:
      maxSize: 100
      minIdle: 20
      maxLifetime: 1800000
      connectionTimeout: 30000
      validationTimeout: 5000
      idleTimeout: 600000
      leakDetectionThreshold: 0

  # Axon Server scheduler settings for the embedded event scheduler.
  # @param commandService.dbScheduler.threads Scheduler worker threads
  # @param commandService.dbScheduler.heartbeatInterval Scheduler heartbeat interval
  # @param commandService.dbScheduler.immediateExecutionEnabled Allow immediate execution
  # @param commandService.dbScheduler.pollingInterval Scheduler polling interval
  # @param commandService.dbScheduler.pollingStrategy Scheduler polling strategy (lock_and_fetch, fetch)
  # @param commandService.dbScheduler.pollingStrategyLowerLimitFractionOfThreads Lower bound for polling strategy threads
  # @param commandService.dbScheduler.pollingStrategyUpperLimitFractionOfThreads Upper bound for polling strategy threads
  # @param commandService.dbScheduler.shutdownMaxWait Maximum wait for graceful shutdown
  # @param commandService.dbScheduler.deleteUnresolvedAfter Delay before deleting unresolved tasks
  dbScheduler:
    threads: 100
    heartbeatInterval: PT5M
    immediateExecutionEnabled: false
    pollingInterval: PT0.5S
    pollingStrategy: lock_and_fetch
    pollingStrategyLowerLimitFractionOfThreads: 0.5
    pollingStrategyUpperLimitFractionOfThreads: 3.0
    shutdownMaxWait: PT30M
    deleteUnresolvedAfter: P14D

  # Kafka producer settings.
  # @param commandService.kafka.producer.retries Producer retry count
  kafka:
    producer:
      retries: 3

  # Caffeine cache settings for the showcase model.
  # @param commandService.showcaseCache.maxSize Maximum cache entries
  # @param commandService.showcaseCache.expiresAfterAccess Entry expiry after access
  # @param commandService.showcaseCache.expiresAfterWrite Entry expiry after write
  showcaseCache:
    maxSize: 100000
    expiresAfterAccess: PT10M
    expiresAfterWrite: PT5M

  # Caffeine cache settings for the saga model.
  # @param commandService.sagaCache.maxSize Maximum cache entries
  # @param commandService.sagaCache.expiresAfterAccess Entry expiry after access
  # @param commandService.sagaCache.expiresAfterWrite Entry expiry after write
  sagaCache:
    maxSize: 1000
    expiresAfterAccess: PT10M
    expiresAfterWrite: PT5M

  # Caffeine cache settings for the saga associations model.
  # @param commandService.sagaAssociationsCache.maxSize Maximum cache entries
  # @param commandService.sagaAssociationsCache.expiresAfterAccess Entry expiry after access
  # @param commandService.sagaAssociationsCache.expiresAfterWrite Entry expiry after write
  sagaAssociationsCache:
    maxSize: 1000
    expiresAfterAccess: PT10M
    expiresAfterWrite: PT5M

  # Snapshot trigger settings for the showcase aggregate.
  # @param commandService.showcaseSnapshotTrigger.loadTimeThreshold Load time threshold before snapshotting
  showcaseSnapshotTrigger:
    loadTimeThreshold: PT0.5S

  # @param commandService.extraEnvVars Extra environment variables (string map)
  # @param commandService.extraEnvVarsCM Name of a ConfigMap providing extra env vars
  # @param commandService.extraEnvVarsSecret Name of a Secret providing extra env vars
  extraEnvVars:
    JAVA_OPTS: "-XX:MaxDirectMemorySize=128M -XX:MaxGCPauseMillis=20"

  extraEnvVarsCM: ""

  extraEnvVarsSecret: ""

  # @param commandService.containerPorts.server Application HTTP port
  # @param commandService.containerPorts.managementServer Actuator HTTP port
  # @param commandService.containerPorts.jgroups JGroups clustering port
  # @param commandService.extraContainerPorts Additional container ports
  containerPorts:
    server: 8080
    managementServer: 8888
    jgroups: 7800

  extraContainerPorts: [ ]

  # @param commandService.startupProbe Startup probe configuration
  # @param commandService.livenessProbe Liveness probe configuration
  # @param commandService.readinessProbe Readiness probe configuration
  startupProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # @param commandService.resources.requests CPU/memory requests
  # @param commandService.resources.limits CPU/memory limits
  resources:
    requests:
      cpu: 1.0
      memory: 0.5Gi
    limits:
      cpu: 3.0
      memory: 1Gi

  # @param commandService.lifecycleHooks Container lifecycle hooks
  # @param commandService.affinity Pod affinity
  # @param commandService.podAffinityPreset Pod affinity preset
  # @param commandService.podAntiAffinityPreset Pod anti-affinity preset
  # @param commandService.nodeAffinityPreset Node affinity preset
  lifecycleHooks: { }

  affinity: { }

  podAffinityPreset: ""

  podAntiAffinityPreset: soft

  nodeAffinityPreset:
    type: ""
    key: ""
    values: [ ]

  # @param commandService.automountServiceAccountToken Mount the service account token into the pods
  # @param commandService.hostAliases Pod host aliases
  # @param commandService.nodeSelector Node labels for pod assignment
  # @param commandService.tolerations Pod tolerations
  # @param commandService.priorityClassName Pod priority class name
  # @param commandService.schedulerName Custom pod scheduler name
  # @param commandService.topologySpreadConstraints Pod topology spread constraints
  # @param commandService.terminationGracePeriodSeconds Pod termination grace period (seconds)
  # @param commandService.terminationMessagePolicy Termination message policy (File, FallbackToLogsOnError)
  automountServiceAccountToken: true

  hostAliases: [ ]

  nodeSelector: { }

  tolerations: [ ]

  priorityClassName: ""

  schedulerName: ""

  topologySpreadConstraints: [ ]

  terminationGracePeriodSeconds: ""

  terminationMessagePolicy: FallbackToLogsOnError

  # @param commandService.podSecurityContext Pod security context
  # @param commandService.containerSecurityContext Container security context
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: [ ]
    supplementalGroups: [ ]
    fsGroup: 1001

  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # @param commandService.extraVolumeMounts Additional volume mounts
  # @param commandService.extraVolumes Additional volumes
  # @param commandService.initContainers Additional init containers
  # @param commandService.sidecars Additional sidecar containers
  # @param commandService.extraPodSpec Extra pod spec fields
  extraVolumeMounts: [ ]

  extraVolumes: [ ]

  initContainers: [ ]

  sidecars: [ ]

  extraPodSpec: { }

  # Autoscaling configuration.
  # @param commandService.autoscaling.vpa.enabled Enable a Vertical Pod Autoscaler
  # @param commandService.autoscaling.hpa.enabled Enable a Horizontal Pod Autoscaler
  autoscaling:
    vpa:
      enabled: false
      controlledResources: [ ]
      maxAllowed: { }
      minAllowed: { }
      updatePolicy:
        updateMode: Auto
    hpa:
      enabled: false
      minReplicas: 3
      maxReplicas: 5
      targetCPU: 80
      targetMemory: ""
      metrics: [ ]

  # @param commandService.pdb.create Enable a PodDisruptionBudget
  # @param commandService.pdb.minAvailable Minimum available replicas
  # @param commandService.pdb.maxUnavailable Maximum unavailable replicas
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  # @param commandService.networkPolicy.enabled Enable a NetworkPolicy
  # @param commandService.networkPolicy.addExternalClientAccess Allow access from external client pods
  # @param commandService.networkPolicy.ingressPodMatchLabels Ingress sources matching pod labels
  # @param commandService.networkPolicy.ingressManagementNSMatchLabels Ingress namespaces for the management port
  # @param commandService.networkPolicy.ingressManagementNSPodMatchLabels Ingress pods for the management port
  # @param commandService.networkPolicy.extraIngress Extra ingress rules
  # @param commandService.networkPolicy.extraEgress Extra egress rules
  networkPolicy:
    enabled: true
    addExternalClientAccess: true
    ingressPodMatchLabels: { }
    ingressManagementNSMatchLabels: { }
    ingressManagementNSPodMatchLabels: { }
    extraIngress: [ ]
    extraEgress: [ ]

  # Prometheus ServiceMonitor configuration.
  # @param commandService.serviceMonitor.enabled Enable scraping via a ServiceMonitor
  # @param commandService.serviceMonitor.namespace Namespace for the ServiceMonitor
  # @param commandService.serviceMonitor.labels Additional labels for the ServiceMonitor
  # @param commandService.serviceMonitor.annotations Additional annotations for the ServiceMonitor
  # @param commandService.serviceMonitor.interval Scrape interval
  # @param commandService.serviceMonitor.scrapeTimeout Scrape timeout
  # @param commandService.serviceMonitor.relabelings Metric relabelings
  # @param commandService.serviceMonitor.metricRelabelings Label relabelings
  # @param commandService.serviceMonitor.honorLabels Honor original labels
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: { }
    annotations: { }
    interval: ""
    scrapeTimeout: ""
    relabelings: [ ]
    metricRelabelings: [ ]
    honorLabels: false

