serviceAccount:

  create: true

  name: ""

  labels: { }

  annotations: { }

  automountServiceAccountToken: true

# @param rbac.create Enable creation of a Role and RoleBinding
# @param rbac.rules Additional RBAC rules
rbac:
  create: true
  rules: [ ]
