# @section API gateway parameters
# API gateway: REST entry point that routes requests to the command and query services.
apiGateway:

  # @param apiGateway.labels Additional labels for the service resources
  # @param apiGateway.annotations Additional annotations for the service resources
  # @param apiGateway.podLabels Additional labels for the pods
  # @param apiGateway.podAnnotations Additional annotations for the pods
  labels: { }

  annotations: { }

  podLabels: { }

  podAnnotations: { }

  # @param apiGateway.image.registry API gateway image registry
  # @param apiGateway.image.repository API gateway image repository
  # @param apiGateway.image.tag API gateway image tag
  # @param apiGateway.image.digest API gateway image digest (overrides tag if set)
  # @param apiGateway.image.pullPolicy API gateway image pull policy (Always, IfNotPresent, Never)
  # @param apiGateway.image.pullSecrets API gateway image pull secrets
  image:
    registry: ""
    repository: aanbrn/axon-showcase-api-gateway
    tag: ${projectVersion}
    digest: ""
    pullPolicy: null
    pullSecrets: [ ]

  # @param apiGateway.replicaCount Number of API gateway replicas
  # @param apiGateway.revisionHistoryLimit Number of old ReplicaSets to keep
  # @param apiGateway.updateStrategy.type Deployment update strategy type (RollingUpdate, Recreate)
  replicaCount: 1

  revisionHistoryLimit: 10

  updateStrategy:
    type: RollingUpdate

  # Caffeine cache settings per query class.
  # @param apiGateway.caches.CacheName.maxSize Maximum entries for the query cache
  # @param apiGateway.caches.CacheName.expiresAfterAccess Cache entry expiry after access
  # @param apiGateway.caches.CacheName.expiresAfterWrite Cache entry expiry after write
  caches:
    FetchShowcaseListQuery:
      maxSize: 10000
      expiresAfterAccess: PT10M
      expiresAfterWrite: PT5M
    FetchShowcaseByIdQuery:
      maxSize: 100000
      expiresAfterAccess: PT10M
      expiresAfterWrite: PT5M

  # Browser origins allowed to call the gateway cross-origin.
  # @param apiGateway.cors.allowedOrigins List of allowed origins (empty denies all browser origins)
  cors:
    allowedOrigins: []

  # @param apiGateway.extraEnvVars Extra environment variables (string map)
  # @param apiGateway.extraEnvVarsCM Name of a ConfigMap providing extra env vars
  # @param apiGateway.extraEnvVarsSecret Name of a Secret providing extra env vars
  extraEnvVars:
    JAVA_OPTS: "-XX:MaxDirectMemorySize=128M -XX:MaxGCPauseMillis=20"

  extraEnvVarsCM: ""

  extraEnvVarsSecret: ""

  # @param apiGateway.containerPorts.server Application HTTP port
  # @param apiGateway.containerPorts.managementServer Actuator HTTP port
  # @param apiGateway.containerPorts.jgroups JGroups clustering port
  # @param apiGateway.extraContainerPorts Additional container ports
  containerPorts:
    server: 8080
    managementServer: 8888
    jgroups: 7800

  extraContainerPorts: [ ]

  # @param apiGateway.startupProbe Startup probe configuration
  # @param apiGateway.livenessProbe Liveness probe configuration
  # @param apiGateway.readinessProbe Readiness probe configuration
  startupProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # @param apiGateway.resources.requests CPU/memory requests
  # @param apiGateway.resources.limits CPU/memory limits
  resources:
    requests:
      cpu: 1.0
      memory: 0.5Gi
    limits:
      cpu: 3.0
      memory: 1Gi

  # @param apiGateway.lifecycleHooks Container lifecycle hooks
  # @param apiGateway.affinity Pod affinity
  # @param apiGateway.podAffinityPreset Pod affinity preset
  # @param apiGateway.podAntiAffinityPreset Pod anti-affinity preset
  # @param apiGateway.nodeAffinityPreset Node affinity preset
  lifecycleHooks: { }

  affinity: { }

  podAffinityPreset: ""

  podAntiAffinityPreset: soft

  nodeAffinityPreset:
    type: ""
    key: ""
    values: [ ]

  # @param apiGateway.automountServiceAccountToken Mount the service account token into the pods
  # @param apiGateway.hostAliases Pod host aliases
  # @param apiGateway.nodeSelector Node labels for pod assignment
  # @param apiGateway.tolerations Pod tolerations
  # @param apiGateway.priorityClassName Pod priority class name
  # @param apiGateway.schedulerName Custom pod scheduler name
  # @param apiGateway.topologySpreadConstraints Pod topology spread constraints
  # @param apiGateway.terminationGracePeriodSeconds Pod termination grace period (seconds)
  # @param apiGateway.terminationMessagePolicy Termination message policy (File, FallbackToLogsOnError)
  automountServiceAccountToken: true

  hostAliases: [ ]

  nodeSelector: { }

  tolerations: [ ]

  priorityClassName: ""

  schedulerName: ""

  topologySpreadConstraints: [ ]

  terminationGracePeriodSeconds: ""

  terminationMessagePolicy: FallbackToLogsOnError

  # @param apiGateway.podSecurityContext Pod security context
  # @param apiGateway.containerSecurityContext Container security context
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: [ ]
    supplementalGroups: [ ]
    fsGroup: 1001

  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # @param apiGateway.extraVolumeMounts Additional volume mounts
  # @param apiGateway.extraVolumes Additional volumes
  # @param apiGateway.initContainers Additional init containers
  # @param apiGateway.sidecars Additional sidecar containers
  # @param apiGateway.extraPodSpec Extra pod spec fields
  extraVolumeMounts: [ ]

  extraVolumes: [ ]

  initContainers: [ ]

  sidecars: [ ]

  extraPodSpec: { }

  # Resilience4j settings for outbound calls to the command/query services.
  # @param apiGateway.resilience.enabled Master switch for resilience features
  # @param apiGateway.resilience.timelimiter.enabled Enable time limiter per call
  # @param apiGateway.resilience.circuitbreaker.enabled Enable circuit breaker
  # @param apiGateway.resilience.retry.enabled Enable retries
  # Per-target overrides may be specified under <commandService|queryService>.
  resilience:
    enabled: true
    timelimiter:
      enabled: true
      defaults:
        timeoutDuration: PT1S
      commandService:
        timeoutDuration: ""
      queryService:
        timeoutDuration: ""
    circuitbreaker:
      enabled: true
      defaults:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 50
        failureRateThreshold: 50
        slowCallRateThreshold: 90
        slowCallDurationThreshold: PT5S
        waitDurationInOpenState: PT10S
        exponentialBackoffMultiplier: 1.5
        exponentialMaxWaitDurationInOpenState: ""
        permittedNumberOfCallsInHalfOpenState: 10
        maxWaitDurationInHalfOpenState: PT0S
      commandService:
        slidingWindowType: ""
        slidingWindowSize: ""
        minimumNumberOfCalls: ""
        failureRateThreshold: ""
        slowCallRateThreshold: ""
        slowCallDurationThreshold: ""
        waitDurationInOpenState: ""
        exponentialBackoffMultiplier: ""
        exponentialMaxWaitDurationInOpenState: ""
        permittedNumberOfCallsInHalfOpenState: ""
        maxWaitDurationInHalfOpenState: ""
      queryService:
        slidingWindowType: ""
        slidingWindowSize: ""
        minimumNumberOfCalls: ""
        failureRateThreshold: ""
        slowCallRateThreshold: ""
        slowCallDurationThreshold: ""
        waitDurationInOpenState: ""
        exponentialBackoffMultiplier: ""
        exponentialMaxWaitDurationInOpenState: ""
        permittedNumberOfCallsInHalfOpenState: ""
        maxWaitDurationInHalfOpenState: ""
    retry:
      enabled: true
      defaults:
        maxAttempts: 2
        waitDuration: PT0.5S
        exponentialBackoffMultiplier: 1.5
        randomizedWaitFactor: 0.5
        exponentialMaxWaitDuration: ""
      commandService:
        maxAttempts: ""
        waitDuration: ""
        exponentialBackoffMultiplier: ""
        randomizedWaitFactor: ""
        exponentialMaxWaitDuration: ""
      queryService:
        maxAttempts: ""
        waitDuration: ""
        exponentialBackoffMultiplier: ""
        randomizedWaitFactor: ""
        exponentialMaxWaitDuration: ""

  # Autoscaling configuration.
  # @param apiGateway.autoscaling.vpa.enabled Enable a Vertical Pod Autoscaler
  # @param apiGateway.autoscaling.hpa.enabled Enable a Horizontal Pod Autoscaler
  autoscaling:
    vpa:
      enabled: false
      controlledResources: [ ]
      maxAllowed: { }
      minAllowed: { }
      updatePolicy:
        updateMode: Auto
    hpa:
      enabled: false
      minReplicas: 3
      maxReplicas: 5
      targetCPU: 80
      targetMemory: ""
      metrics: [ ]

  # @param apiGateway.pdb.create Enable a PodDisruptionBudget
  # @param apiGateway.pdb.minAvailable Minimum available replicas
  # @param apiGateway.pdb.maxUnavailable Maximum unavailable replicas
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  # @param apiGateway.networkPolicy.enabled Enable a NetworkPolicy
  # @param apiGateway.networkPolicy.addExternalClientAccess Allow access from external client pods
  # @param apiGateway.networkPolicy.ingressPodMatchLabels Ingress sources matching pod labels
  # @param apiGateway.networkPolicy.ingressManagementNSMatchLabels Ingress namespaces for the management port
  # @param apiGateway.networkPolicy.ingressManagementNSPodMatchLabels Ingress pods for the management port
  # @param apiGateway.networkPolicy.extraIngress Extra ingress rules
  # @param apiGateway.networkPolicy.extraEgress Extra egress rules
  networkPolicy:
    enabled: true
    addExternalClientAccess: true
    ingressPodMatchLabels: { }
    ingressManagementNSMatchLabels: { }
    ingressManagementNSPodMatchLabels: { }
    extraIngress: [ ]
    extraEgress: [ ]

  # Prometheus ServiceMonitor configuration.
  # @param apiGateway.serviceMonitor.enabled Enable scraping via a ServiceMonitor
  # @param apiGateway.serviceMonitor.namespace Namespace for the ServiceMonitor
  # @param apiGateway.serviceMonitor.labels Additional labels for the ServiceMonitor
  # @param apiGateway.serviceMonitor.annotations Additional annotations for the ServiceMonitor
  # @param apiGateway.serviceMonitor.interval Scrape interval
  # @param apiGateway.serviceMonitor.scrapeTimeout Scrape timeout
  # @param apiGateway.serviceMonitor.relabelings Metric relabelings
  # @param apiGateway.serviceMonitor.metricRelabelings Label relabelings
  # @param apiGateway.serviceMonitor.honorLabels Honor original labels
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: { }
    annotations: { }
    interval: ""
    scrapeTimeout: ""
    relabelings: [ ]
    metricRelabelings: [ ]
    honorLabels: false

  # Ingress configuration (Kubernetes Ingress).
  # @param apiGateway.ingress.enabled Enable an Ingress
  # @param apiGateway.ingress.ingressClassName Ingress class name
  # @param apiGateway.ingress.hostname Ingress hostname
  # @param apiGateway.ingress.path Path for the service
  # @param apiGateway.ingress.pathType Ingress path type (Prefix, Exact, ImplementationSpecific)
  # @param apiGateway.ingress.extraPaths Additional paths
  # @param apiGateway.ingress.extraHosts Additional hosts
  # @param apiGateway.ingress.extraRules Additional rules
  ingress:
    enabled: false
    ingressClassName: ""
    hostname: ""
    path: /
    pathType: Prefix
    extraPaths: [ ]
    extraHosts: [ ]
    extraRules: [ ]

  # Gateway API HTTPRoute configuration.
  # @param apiGateway.route.enabled Enable an HTTPRoute
  # @param apiGateway.route.labels Additional labels for the HTTPRoute
  # @param apiGateway.route.annotations Additional annotations for the HTTPRoute
  # @param apiGateway.route.hostnames HTTPRoute hostnames
  # @param apiGateway.route.parentRefs Parent gateway references
  # @param apiGateway.route.matches HTTPRoute match rules
  # @param apiGateway.route.filters HTTPRoute filters
  # @param apiGateway.route.extraRules Additional rules
  route:
    enabled: false
    labels: { }
    annotations: { }
    hostnames: [ ]
    parentRefs: [ ]
    matches:
      - path:
          type: PathPrefix
          value: /
    filters: [ ]
    extraRules: [ ]

# @section Observability parameters
# Observability configuration shared by all services.
# @param observability.logging.structured.enabled Enable structured logging
# @param observability.logging.structured.format Structured logging format
# @param observability.tracing.sampling.probability Sampling probability for traces
# @param observability.prometheus.metrics.export.enabled Export metrics to Prometheus
# @param observability.otlp.metrics.export.enabled Export metrics via OTLP
# @param observability.otlp.metrics.export.endpoint OTLP metrics endpoint
# @param observability.otlp.metrics.export.step OTLP metrics export interval
# @param observability.otlp.tracing.export.enabled Export traces via OTLP
# @param observability.otlp.tracing.export.endpoint OTLP tracing endpoint
# @param observability.otlp.tracing.export.compression OTLP tracing compression
observability:
  logging:
    structured:
      enabled: false
      format: ecs
  tracing:
    sampling:
      probability: 0.1
  prometheus:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
        endpoint: ""
        step: PT30S
    tracing:
      export:
        enabled: false
        endpoint: ""
        compression: none

# @section RBAC parameters
# Service account and RBAC configuration.
# @param serviceAccount.create Enable creation of a dedicated ServiceAccount
# @param serviceAccount.name Name of the ServiceAccount (defaults to the fullname)
