osViews:
  secured: true

observability:
  logging:
    structured:
      enabled: true
      format: ecs
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: true
        endpoint: http://tempo.monitoring.svc.cluster.local:4318
        step: PT30S
    tracing:
      export:
        enabled: true
        endpoint: http://tempo.monitoring.svc.cluster.local:4317
        compression: gzip

rbac:
  rules:
    - apiGroups: [ "" ]
      resources: [ "services", "endpoints" ]
      verbs: [ "get", "list" ]

extraDeploy:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: extra-configmap
    data:
      key: value
