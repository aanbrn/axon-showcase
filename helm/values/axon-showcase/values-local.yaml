fullnameOverride: axon-showcase

commandService:
  podLabels:
    axon-showcase-db-events-client: "true"
    axon-showcase-kafka-client: "true"
  replicaCount: 2
  networkPolicy:
    ingressManagementNSMatchLabels:
      name: monitoring
    ingressManagementNSPodMatchLabels:
      prometheus: kps
  serviceMonitor:
    namespace: monitoring
    labels:
      release: kps

projectionService:
  podLabels:
    axon-showcase-kafka-client: "true"
    axon-showcase-os-views-client: "true"
  networkPolicy:
    ingressManagementNSMatchLabels:
      name: monitoring
    ingressManagementNSPodMatchLabels:
      prometheus: kps
  serviceMonitor:
    namespace: monitoring
    labels:
      release: kps

queryService:
  podLabels:
    axon-showcase-os-views-client: "true"
  networkPolicy:
    ingressManagementNSMatchLabels:
      name: monitoring
    ingressManagementNSPodMatchLabels:
      prometheus: kps
  serviceMonitor:
    namespace: monitoring
    labels:
      release: kps

apiGateway:
  podLabels:
    axon-showcase-kafka-client: "true"
  cors:
    allowedOrigins:
      - http://axon-showcase-ui
  ingress:
    enabled: true
    hostname: axon-showcase-api
  networkPolicy:
    ingressManagementNSMatchLabels:
      name: monitoring
    ingressManagementNSPodMatchLabels:
      prometheus: kps
  serviceMonitor:
    namespace: monitoring
    labels:
      release: kps

webUi:
  # The browser reaches the gateway via its ingress hostname (resolved by setup-hosts.sh), not the in-cluster Service
  # name, so the UI is pointed at the externally-visible gateway URL.
  apiBaseUrl: http://axon-showcase-api
  ingress:
    enabled: true
    hostname: axon-showcase-ui
  networkPolicy:
    ingressManagementNSMatchLabels:
      name: monitoring
    ingressManagementNSPodMatchLabels:
      prometheus: kps
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kps

observability:
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    tracing:
      export:
        enabled: true
        endpoint: http://tempo.monitoring.svc.cluster.local:4317
