schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  axon-showcase — a CQRS/Event Sourcing reference app built on the Axon Framework.
  Java 21, Spring Boot 3.5.16, Gradle 9.8.2 (Kotlin DSL), monorepo with 19 modules.

  Architecture (four services and the web UI):
    - showcase-command-service — write side, Axon aggregate, publishes events to Kafka,
      PostgreSQL event store
    - showcase-projection-service — consumes Kafka events, writes projections to OpenSearch
    - showcase-query-service — read side, queries OpenSearch, serves a generic gRPC query transport
    - showcase-api-gateway — REST entry point (/showcases), routes to command/query services
    - showcase-web-ui — React + Vite (Feature-Sliced Design) browser UI, deployed as an nginx image
  Key library modules: showcase-command-api / showcase-query-api (interfaces + testFixtures),
  showcase-command-client / showcase-query-client (reactive clients), showcase-query-proto
  (Protobuf + gRPC), showcase-projection-model, showcase-test, showcase-identifier-extension (KSUID),
  showcase-mapstruct-extension, showcase-resilience4j-extension, platform (Java BOM),
  build-logic (Gradle convention plugins), helm (Helm releases), load-tests (Gatling).

  Conventions:
    - No comments in source code
    - Wrap code and text at 120 characters
    - Write every agent-authored artifact and repository document in English
    - Load the owning subject pack before a decision in its subject:
      `.opencode/skills/jvm-development/SKILL.md`, `.opencode/skills/jvm-testing/SKILL.md`,
      `.opencode/skills/gradle-build/SKILL.md`, or `.opencode/skills/deployment-operations/SKILL.md` — the root
      `AGENTS.md` table states the triggers

  Build & test (./gradlew):
    - The root's verification entry point is
      `./gradlew :<module>:check -PskipITs -Pcoverage.gate.enabled=false`
    - The command surface, test tiers and execution prerequisites, build gates, and failure diagnosis are in
      `.opencode/skills/jvm-testing/SKILL.md` and `.opencode/skills/gradle-build/SKILL.md`
    - `./db.sh init` creates user `showcase` and database `showcase-events` before running
      the command-service standalone; the DB-scripts block is in `.opencode/skills/deployment-operations/SKILL.md`

  Docker images and deployment: the five `aanbrn/axon-showcase-*` images, their release publishing to the GitHub
  Container Registry, and the Helm chart (`helm/chart`, `./gradlew helmInstallToLocal`) are documented in
  `.opencode/skills/deployment-operations/SKILL.md`

# Per-artifact rules
rules:
  proposal:
    - 'Keep the "Why" section concrete: what breaks today without the change'
    - List "What Changes" at the file level, not as a rephrasing of Why
    - Declare "New Capabilities" / "Modified Capabilities" using existing capability names
    - Note the "Impact" on the code, APIs, dependencies, and systems the change affects, and on build, tests, and
      deployment where they move
    - Every claim about a run log, issue state, or external artifact is read from that artifact, not recalled
    - Every count — and every universal claim, its absence form included — is re-derived by grepping the set it counts,
      with one command per part of its subject, naming the instances it covers where the class has no greppable
      predicate
    - A claim, a rule set, or a record stated in more than one artifact is single-sourced, the rest referencing it by
      name
    - A change that adds, widens, retires, or replaces a member of a set or a behavior stated in more than one file (a
      swept surface, a finding class, an output kind, a documented enumeration, a workflow) derives the sites it touches
      from the durable surfaces the behavior can live in, one task per file, never from a hand-written list and never
      from the change's own tasks — the tasks are checked against that set, so deriving the set from them cannot find a
      missing task
    - Follow the "Structured Writing Standard" in AGENTS.md — one bullet per change in "What Changes", not a paragraph
      carrying several independent points
  specs:
    - A claim, a rule set, or a record stated in more than one artifact is single-sourced, the rest referencing it by
      name
    - Requirements are declarative SHALL statements, testable via WHEN/THEN scenarios
    - 'Delta specs use ADDED/MODIFIED/REMOVED/RENAMED requirement blocks, a rename in FROM:/TO: form'
    - Keep scenario wording consistent with existing captured specs
    - A requirement whose body enumerates its subjects needs a scenario exercising each
    - Follow the "Structured Writing Standard" in AGENTS.md — one behavior per requirement and one WHEN/THEN pair per
      scenario, with no requirement body carrying several behaviors
  design:
    - Start with "Context" referencing the proposal, then "Goals / Non-Goals"
    - Capture "Decisions" with the alternatives considered and why they were rejected
    - Flag "Risks / Trade-offs" with concrete mitigation
    - A change that amends an existing requirement's obligation or permission quotes each amended clause beside its
      replacement and states why, since a `MODIFIED` block replaces the whole requirement and `openspec validate`
      checks only scenario preservation; a change that removes, splits, or moves a block of obligations carries the
      per-obligation destination trace its `AGENTS.md` route requires, as a table, since a group-level mapping has no
      row for a clause that moved inside a group
    - A claim, a rule set, or a record stated in more than one artifact is single-sourced, the rest referencing it by
      name
    - Every mechanism or task-check claim is derived from the dependency graph or the tool's own definition, and a
      term or mechanism name with no referent in the repository is deleted rather than defined
    - Carry the claims table — each fact the change states about its evidence (the prior artifacts it rests on) with its
      source or the command that derives it, re-run so it reproduces the figure the row records; a row whose claim is
      about the state before the change anchors to the unit's base revision (`git merge-base HEAD origin/main`),
      recorded as the SHA, never to `HEAD` or `origin/main`, which move — `git show <sha>:<path>` for the change's own
      artifact and its embedded commands, since a script opening the working-tree file reports the implemented result;
      `git grep … <sha>` for a historical claim over a corpus;
      a source that is a command's output states the reason by class, never a list of
      its lines; and each dismissal states its reason by kind, never as an enumerating clause; and the table is
      re-derived after the unit's last append to its own record, which adds a scan candidate; a self-record fact about
      what the change did (a stated delta, a `Done` note, a described edit) is derived from the source it names once
      the edits land — the diff for a stated delta or a described edit, the ledger or the command's own output for a
      process record — and a claim whose described edit is absent is deleted rather than reworded
    - Every count — and every universal claim, its absence form included — is re-derived by grepping the set it counts,
      with one command per part of its subject, naming the instances it covers where the class has no greppable
      predicate
    - Follow the "Structured Writing Standard" in AGENTS.md — one decision per entry with its alternatives as separate
      bullets, and a table for the claims table or any like-row content
    - 'Before naming a site for a later sweep, read and apply the rule identified by "quoted by its text or token"
      in `.opencode/skills/review-gate/SKILL.md` §1 step 2.'
  tasks:
    - Break tasks into chunks of max 2 hours
    - Reference exact file paths and commands so each task is verifiable
    - 'Group into sections: implementation tasks, then a verification section'
    - A change that adds or changes a check must include a committed test asserting it fails on a known-bad input and
      passes on a known-good one — a gate whose logic lives in a rules object carries the case in that object's
      `*RulesTests`, an inline gate in its consuming module — instead of a task asserting the control was run, plus a
      task to read the output of any scratch command used as evidence
    - Include the unit's process-defect record as a task in every change — write `docs/process-defects/<unit>.md` as
      defects are observed, or state that none was observed — so a unit that skipped the record reads as a missing box
      rather than a run that found nothing
    - Carry the deep-review routing decision as a task in every change — derive the floor with
      `scripts/review-routing.py`, decide at or above it, and record the outcome and the signals it relied on on the
      change's review task — so a missing or failed decision reads as a missing box rather than a silent skip
    - Carry the pre-write derivation pass as a task in every change — the pass the `review-gate` skill's first stage
      names, whose output is the claims table, never restated here — so a skipped pass is a missing box rather than
      looking like a pass that found nothing
    - A claim, a rule set, or a record stated in more than one artifact is single-sourced, the rest referencing it by
      name
    - Every count — and every universal claim, its absence form included — is re-derived by grepping the set it counts,
      with one command per part of its subject, naming the instances it covers where the class has no greppable
      predicate
    - A task that sweeps for an enumerated set names the set's members to grep, never a phrase one enumeration uses —
      an enumeration may list its members as bullet labels no phrase pattern reaches
    - A normative clause that prohibits content — the root, a command, or a spec SHALL NOT restate a procedure's steps,
      a field set, or a record — carries its own task, reading every artifact the change creates for the prohibited
      content, since a prohibition has no implementation site and nothing else verifies it
    - Follow the "Structured Writing Standard" in AGENTS.md — one action per task, its verification stated in the same
      task
    - 'Before naming a site for a later sweep, read and apply the rule identified by "quoted by its text or token"
      in `.opencode/skills/review-gate/SKILL.md` §1 step 2.'

# Per-operation guidance
operations:
  apply:
    guidance:
      - Fetch status and apply instructions with --json before starting
      - Read the change's proposal, spec, design, and tasks first
      - Verify each deliverable against its task description; note pre-existing work
      - Mark task checkboxes as they are completed, with verification evidence
      - Run the exact commands listed in the verification tasks
      - Write and revise every artifact to the "Structured Writing Standard" in AGENTS.md — structure the content into
        its sections and lists before drafting, not as a cleanup pass afterward
  archive:
    guidance:
      - Run openspec archive --yes only after all tasks are complete
      - Confirm the specs update output (+/- deltas) and summarize the outcome
      - Finish by running openspec validate --specs
