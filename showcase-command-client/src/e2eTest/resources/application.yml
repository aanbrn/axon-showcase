spring:
  application:
    name: showcase-command-client-end-to-end-test
  main:
    banner-mode: off

axon:
  serializer:
    messages: jackson
  distributed:
    enabled: true
    jgroups:
      configuration-file: tunnel.xml
      bind-addr: localhost
      bind-port: ${random.int[7810,8000)}
      cluster-name: axon-showcase
